        // ========== LRC歌词解析：把文本解析成 [{time:秒数, text:"歌词"}] ==========
        function parseLrc(lrcText){
            const lines = lrcText.split('\n');
            const result = [];
            const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            lines.forEach(line=>{
                const match = line.match(reg);
                if(match){
                    const min = Number(match[1]), sec = Number(match[2]), ms = Number(match[3]);
                    const time = min*60 + sec + ms/1000;
                    const text = line.replace(reg,'').trim();
                    if(text) result.push({time,text});
                }
            });
            return result.sort((a,b)=>a.time-b.time);   // 按时间排序
        }

                lyricWrap.appendChild(div);
            });
            lyricWrap.offsetHeight;   // 强制回流，拿到真实高度
            updateLyric(0, list);
        }

        // ========== 更新歌词高亮与滚动（只限顶部，不限底部，避免中途卡死）==========
        function updateLyric(nowTime, list){
            if(!list || list.length === 0) return;
            let activeIndex = 0;
            for(let i=0;i<list.length;i++){
                if(nowTime >= list[i].time) activeIndex = i;   // 找到当前时间对应歌词
            }
            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach((line,idx)=>{
                line.classList.toggle('active', idx === activeIndex);
            });
            const lineHeight = 40;
            const boxHeight = lyricWrap.parentElement.clientHeight || 320;
            let translateY = -activeIndex * lineHeight + boxHeight/2;   // 当前行垂直居中
            if(translateY > 0) translateY = 0;   // 只限制开头，不锁底部
            lyricWrap.style.transform = `translateY(${translateY}px)`;
        }

        // ========== 帧循环更新歌词（跟随屏幕刷新率，比定时器更准）==========
        function lyricLoop(){
            if(!audio.paused && currentLrcList.length>0){
                updateLyric(audio.currentTime, currentLrcList);
            }
            rafId = requestAnimationFrame(lyricLoop);
        }
        function stopLyricLoop(){
            if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
        }

        // ========== Media Session：息屏后继续播放 + 锁屏控制条（不申请唤醒锁，听歌不锁屏）==========
        function updateMediaSession(title, albumName){
            if(!('mediaSession' in navigator)) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title, artist: albumName, album: albumName
            });
            navigator.mediaSession.setActionHandler('play', ()=>{ audio.play(); });
            navigator.mediaSession.setActionHandler('pause', ()=>{ audio.pause(); });
            navigator.mediaSession.setActionHandler('previoustrack', ()=>{ playSongByIndex((currentSongIndex-1+curSongs().length)%curSongs().length); });
            navigator.mediaSession.setActionHandler('nexttrack', ()=>{ playSongByIndex((currentSongIndex+1)%curSongs().length); });
        }

        // ==========【核心】按下标播放当前专辑里的歌（按钮点击 + 自动切下一首 共用）==========
        function playSongByIndex(idx){
            const songs = curSongs();
            if(idx<0 || idx>=songs.length) return;
            const targetSong = songs[idx];
            currentSongIndex = idx;

            // 更新歌曲按钮高亮
            document.querySelectorAll('.play-btn').forEach(b=>b.classList.remove('active'));
            const btn = document.querySelector(`.play-btn[data-index="${idx}"]`);
            if(btn) btn.classList.add('active');

            // 更新歌词
            currentLrcList = parseLrc(targetSong.lrcText);
            renderLyric(currentLrcList);

            // 【关键】复用同一个audio元素，只替换src，保留已获授权的播放状态
            audio.src = targetSong.audioSrc;
            audio.play().catch(err=>{
                console.warn('自动播放被拦截，请点击歌曲按钮继续', err);
            });

            updateMediaSession(targetSong.name, curAlbum().name);
            lyricLoop();
        }

        // ========== 歌曲结束事件：自动切下一首，实现当前专辑循环 ==========
        audio.onended = function(){
            stopLyricLoop();
            const songs = curSongs();
            if(songs.length === 0) return;
            let next = currentSongIndex + 1;
            if(next >= songs.length) next = 0;   // 最后一首回到第一首
            playSongByIndex(next);
        };

        // ========== 切换专辑 ==========
        function switchAlbum(albumIdx){
            if(albumIdx === activeAlbumIndex) return;   // 已在当前专辑，不重复切换
            if(!audio.paused){ audio.pause(); }          // 停掉当前播放
            stopLyricLoop();
            activeAlbumIndex = albumIdx;
            currentSongIndex = -1;

            // 更新专辑按钮高亮 + 专辑名
            document.querySelectorAll('.album-btn').forEach(b=>b.classList.remove('active'));
            const ab = document.querySelector(`.album-btn[data-idx="${albumIdx}"]`);
            if(ab) ab.classList.add('active');
            albumTitle.innerText = "专辑 · " + curAlbum().name;

            renderSongButtons();   // 重新渲染该专辑歌曲按钮
            lyricWrap.innerHTML = '';   // 清空歌词
        }

        // ========== 渲染专辑切换按钮（自动根据albums生成）==========
        function renderAlbumBar(){
            albumBar.innerHTML = "";
            albums.forEach((album, idx)=>{
                const btn = document.createElement('button');
                btn.className = 'album-btn' + (idx===activeAlbumIndex?' active':'');
                btn.innerText = album.name;
                btn.dataset.idx = idx;
                btn.onclick = function(){ if(window.canPlayAudio) switchAlbum(idx); };
                albumBar.appendChild(btn);
            });
            albumTitle.innerText = "专辑 · " + curAlbum().name;
        }

        // ========== 渲染当前专辑的歌曲按钮（自动生成）==========
        function renderSongButtons(){
            btnWrap.innerHTML = "";
            curSongs().forEach((song, index)=>{
                const btn = document.createElement('button');
                btn.className = 'play-btn';
                btn.innerText = song.name;
                btn.dataset.index = index;
                btn.onclick = function(){
                    if(!window.canPlayAudio) return;
                    const songIndex = Number(this.dataset.index);
                    // 点当前正在播放的歌 → 暂停
                    if(currentSongIndex === songIndex && !audio.paused){
                        audio.pause();
                        stopLyricLoop();
                        this.classList.remove('active');
                        return;
                    }
                    playSongByIndex(songIndex);   // 用户手势内播放，不会被拦截
                };
                btnWrap.appendChild(btn);
            });
        }

        // ========== 页面初始化 ==========
        renderAlbumBar();
        renderSongButtons();
    </script>
</body>
</html>
