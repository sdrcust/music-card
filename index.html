        .lyric-line{padding:10px;text-align:center;font-size:18px;color:#aaa}

        // 增减歌曲操作说明：
        // 1.加歌：在数组最后面，复制粘贴一个完整{}，填写name、audioSrc、lrcText
        // 2.删歌：直接删掉对应整首{}，注意逗号
        // 3.专辑扩展：如果要做多专辑页面，可以单独新建一个html文件，复制这套代码，换songList即可
        // =================================================================================


        // =====================【全局变量 - 播放状态】=====================
        let currentAudio = null;       // 当前正在播放的audio对象
        let currentLrcList = [];       // 当前歌曲解析好的歌词数组
        const btnWrap = document.getElementById('btnWrap');
        const lyricWrap = document.getElementById('lyricWrap');


        // =====================【函数：LRC歌词解析器，不用修改】=====================
        // 输入原始LRC文本，输出 [{时间,歌词}] 数组
        function parseLrc(lrcText){
            const lines = lrcText.split('\n');
            const result = [];
            // 正则匹配时间标签 [00:01.234]
            const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            lines.forEach(line=>{
                const match = line.match(reg);
                if(match){
                    // 把分:秒.毫秒转成总秒数，方便对比播放时间
                    const min = Number(match[1]);
                    const sec = Number(match[2]);
                    const ms = Number(match[3]);
                    const time = min*60 + sec + ms/1000;
                    // 提取纯歌词文本
                    const text = line.replace(reg,'').trim();
                    if(text) result.push({time,text});
                }
            })
            // 按时间从小到大排序歌词
            return result.sort((a,b)=>a.time-b.time);
        }


        // =====================【函数：渲染所有歌曲按钮，自动生成，不用手动写button】=====================
        function renderButtons(){
            btnWrap.innerHTML = "";
            songList.forEach((song, index)=>{
                // 创建audio标签，页面不可见，用来播放音频
                const audioDom = document.createElement('audio');
                audioDom.id = `audio-${index}`;
                const sourceDom = document.createElement('source');
                sourceDom.src = song.audioSrc;
                audioDom.appendChild(sourceDom);
                document.body.appendChild(audioDom);

                // 创建播放按钮
                const btn = document.createElement('button');
                btn.className = 'play-btn';
                btn.innerText = song.name;
                btn.dataset.index = index; // 记录这是第几首歌

                // 按钮点击事件
                btn.onclick = function(){
                    const songIndex = Number(this.dataset.index);
                    const targetSong = songList[songIndex];
                    const audio = document.getElementById(`audio-${songIndex}`);

                    // 全部按钮取消高亮
                    document.querySelectorAll('.play-btn').forEach(b=>b.classList.remove('active'));

                    // 逻辑：点同一首正在播放的歌 → 暂停
                    if(currentAudio === audio && !audio.paused){
                        audio.pause();
                        currentAudio = null;
                        return;
                    }

                    // 如果有正在播放的歌，先暂停旧歌曲
                    if(currentAudio) currentAudio.pause();

                    // 切换到新歌
                    currentAudio = audio;
                    this.classList.add('active');
                    currentLrcList = parseLrc(targetSong.lrcText);
                    renderLyric(currentLrcList);
                    audio.play();

                    // 播放时间更新，实时刷新歌词高亮+滚动
                    audio.ontimeupdate = ()=>{
                        updateLyric(audio.currentTime, currentLrcList);
                    }
                }
                btnWrap.appendChild(btn);
            })
        }


        // =====================【函数：渲染歌词列表】=====================
        function renderLyric(list){
            lyricWrap.innerHTML = '';
            list.forEach(item=>{
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.innerText = item.text;
                lyricWrap.appendChild(div);
            })
        }


        // =====================【函数：实时更新歌词高亮与滚动】=====================
        function updateLyric(nowTime, list){
            let activeIndex = 0;
            // 找到当前播放时间对应的歌词行
            for(let i=0;i<list.length;i++){
                if(nowTime >= list[i].time) activeIndex = i;
            }
            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach((line,idx)=>{
                line.classList.toggle('active', idx === activeIndex);
            })
            // 歌词向上滚动，当前行居中
            lyricWrap.style.transform = `translateY(${ -activeIndex * 40 + 140 }px)`;
        }


        // =====================【页面初始化入口，页面加载完成自动执行】=====================
        renderButtons();
    </script>
