    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#111;color:#fff;padding:20px}

        /* 顶部提示栏：代码保留，display:none视觉隐藏，后续需要提示直接删掉display:none */
        .tip-bar{
            background:#ff782b;
            color:#000;
            padding:10px 14px;
            border-radius:8px;
            margin-bottom:20px;
            font-size:14px;
            line-height:1.5;
            display:none;
        }

        /* 支付宝内置浏览器拦截弹窗，检测到支付宝webview弹出提示 */
        .alipay-mask{
            position:fixed;
            inset:0;
            background:#000c;
            z-index:9999;
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .alipay-box{
            background:#222;
            padding:28px 22px;
            border-radius:12px;
            max-width:420px;
        }
        .alipay-box h3{color:#ff6b6b;margin-bottom:12px}
        .alipay-box p{line-height:1.7;color:#eee;font-size:16px}

        /* 歌曲按钮容器，自动换行 */
        .btn-wrap{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px}
        .play-btn{padding:10px 16px;font-size:16px;border:none;border-radius:8px;cursor:pointer;background:#333;color:#fff}
        .play-btn.active{background:#2185ff;color:#fff}

        /* ==========歌词容器========== */
        /* lyric-box：歌词可视取景框，固定最大占屏幕60%高度，超出部分裁剪隐藏 */
        .lyric-box{
            min-height:320px;
            max-height:60vh;
            height:60vh;         /* 明确高度，用于JS计算滚动位置 */
            overflow:hidden;     /* 框外歌词直接看不见，实现取景器效果 */
            position:relative;
            margin-top:16px;
        }
        /* lyric-inner：歌词滚动内层容器，整体上下位移实现滚动 */
        /* transition:none：关闭css过渡动画，避免和JS高频transform冲突导致中途卡死 */
        .lyric-inner{
            transition:none;
            will-change: transform; /* 浏览器GPU加速transform滚动，提升手机流畅度 */
        }
        /* 单行歌词：强制固定40px高度，JS滚动计算行高必须和DOM实际高度完全一致 */
        .lyric-line{
            padding:0 10px;
            text-align:center;
            font-size:18px;
            color:#aaa;
            height:40px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        /* 当前正在演唱高亮歌词 */
        .lyric-line.active{
            color:#2185ff;
            font-weight:bold;
            font-size:20px;
        }
    </style>

        // =================全局变量================
        let currentAudio = null;         // 当前播放audio对象
        let currentLrcList = [];         // 当前歌曲解析完成歌词数组
        let currentSongIndex = -1;        // ✅新增：当前播放歌曲在songList数组下标，-1=未播放
        let rafId = null;                // requestAnimationFrame帧循环ID，用于关闭循环
        const btnWrap = document.getElementById('btnWrap');
        const lyricWrap = document.getElementById('lyricWrap');

        /**
         * @function parseLrc
         * @desc LRC解析函数，把原始字符串解析为 [{time:秒数, text:"歌词"}]
         */
        function parseLrc(lrcText){
            const lines = lrcText.split('\n');
            const result = [];
            const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            lines.forEach(line=>{
                const match = line.match(reg);
                if(match){
                    const min = Number(match[1]);
                    const sec = Number(match[2]);
                    const ms = Number(match[3]);
                    const time = min*60 + sec + ms/1000;
                    const text = line.replace(reg,'').trim();
                    if(text) result.push({time,text});
                }
            })
            return result.sort((a,b)=>a.time-b.time);
        }

        /**
         * @function renderLyric
         * @desc 根据解析好的歌词数组，渲染页面上所有歌词DOM
         * @param {Array} list parseLrc输出的歌词数组
         */
        function renderLyric(list){
            lyricWrap.innerHTML = '';
            list.forEach(item=>{
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.innerText = item.text;
                lyricWrap.appendChild(div);
            });
            lyricWrap.offsetHeight; // 强制浏览器回流，获取真实DOM尺寸
            updateLyric(0, list);
        }

        /**
         * @function updateLyric
         * @desc 根据音频当前时间，更新高亮行、计算歌词滚动位移
         * @param {Number} nowTime 当前音频播放秒数
         * @param {Array} list 当前歌曲歌词数组
         * 修复点：只限制顶部不要向下偏移，不限制底部，允许歌词一直向上滚动，解决唱到某句卡死
         */
        function updateLyric(nowTime, list){
            if(!list || list.length ===0) return;
            let activeIndex = 0;
            // 找到当前时间匹配的歌词下标
            for(let i=0;i<list.length;i++){
                if(nowTime >= list[i].time) activeIndex = i;
            }
            const lines = document.querySelectorAll('.lyric-line');
            // 更新高亮class
            lines.forEach((line,idx)=>{
                line.classList.toggle('active', idx === activeIndex);
            });

            const lineHeight = 40;                         // 单行歌词固定高度，和css保持40px
            const boxHeight = lyricWrap.parentElement.clientHeight || 320; // 获取外层取景框高度
            let translateY =  -activeIndex * lineHeight + boxHeight / 2;    // 让当前歌词行垂直居中

            // 边界：只禁止歌词向下跑（播放刚开始的时候），不做底部锁死，允许后面歌词持续向上滚出屏幕
            if(translateY>0) translateY = 0;

            lyricWrap.style.transform = `translateY(${translateY}px)`;
        }

        /**
         * @function lyricLoop
         * @desc 帧循环，requestAnimationFrame跟随屏幕刷新率执行，比setInterval更精准适配音频
         */
        function lyricLoop(){
            if(currentAudio && !currentAudio.paused && currentLrcList.length>0){
                updateLyric(currentAudio.currentTime, currentLrcList);
            }
            rafId = requestAnimationFrame(lyricLoop);
        }

        /**
         * @function stopLyricLoop
         * @desc 停止帧循环，播放结束/暂停时调用，释放资源
         */
        function stopLyricLoop(){
            if(rafId){
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        /**
         * @function playSongByIndex
         * @desc ✅【核心专辑循环函数】按下标播放指定歌曲，用于按钮点击 + 自动切下一首
         * @param {Number} idx songList数组下标
         */
        function playSongByIndex(idx){
            if(idx <0 || idx >= songList.length) return;
            const targetSong = songList[idx];
            const audio = document.getElementById(`audio-${idx}`);

            // 停止旧播放
            if(currentAudio){
                currentAudio.pause();
                stopLyricLoop();
            }
            document.querySelectorAll('.play-btn').forEach(b=>b.classList.remove('active'));

            // 更新全局状态
            currentSongIndex = idx;
            currentAudio = audio;
            currentLrcList = parseLrc(targetSong.lrcText);
            renderLyric(currentLrcList);

            // 设置按钮高亮
            const btn = document.querySelector(`.play-btn[data-index="${idx}"]`);
            if(btn) btn.classList.add('active');

            audio.play();
            lyricLoop();

            // =========✅ 监听歌曲结束事件，实现专辑列表循环 =========
            audio.onended = function(){
                stopLyricLoop();
                // 计算下一首下标：最后一首 → 回到0，实现专辑循环
                let nextIndex = idx + 1;
                if(nextIndex >= songList.length){
                    nextIndex = 0;
                }
                // 自动播放下一首
                playSongByIndex(nextIndex);
            }
        }

        /**
         * @function renderButtons
         * @desc 根据songList数组自动渲染全部播放按钮，动态创建audio标签
         */
        function renderButtons(){
            btnWrap.innerHTML = "";
            songList.forEach((song, index)=>{
                // 创建隐藏audio音频元素
                const audioDom = document.createElement('audio');
                audioDom.id = `audio-${index}`;
                const sourceDom = document.createElement('source');
                sourceDom.src = song.audioSrc;
                audioDom.appendChild(sourceDom);
                document.body.appendChild(audioDom);

                // 创建按钮
                const btn = document.createElement('button');
                btn.className = 'play-btn';
                btn.innerText = song.name;
                btn.dataset.index = index;

                // 按钮点击事件
                btn.onclick = function(){
                    if(!window.canPlayAudio) return;
                    const songIndex = Number(this.dataset.index);

                    // 如果点【当前正在播放】的歌 → 暂停
                    if(currentSongIndex === songIndex && currentAudio && !currentAudio.paused){
                        currentAudio.pause();
                        stopLyricLoop();
                        this.classList.remove('active');
                        return;
                    }
                    // 否则：播放这一首，播完自动循环专辑
                    playSongByIndex(songIndex);
                }
                btnWrap.appendChild(btn);
            })
        }

        // 页面加载完毕执行初始化，渲染全部按钮
        renderButtons();
    </script>
</body>
