  <div class="lyric-box">

  <audio id="player">

<script>
const player = document.getElementById('player');
const btns = document.querySelectorAll('.music-btn');
const lyricWrap = document.getElementById('lyricWrap');
let lyricList = [];

// LRC歌词解析函数
function parseLRC(lrcText){
  if(!lrcText) return [];
  const lines = lrcText.split('\n');
  const result = [];
  const reg = /\[(\d{2}):(\d{2})\.(\d{2})\]/;
  lines.forEach(line=>{
    const match = line.match(reg);
    if(!match) return;
    const min = Number(match[1]);
    const sec = Number(match[2]);
    const ms = Number(match[3]);
    const time = min*60 + sec + ms/100;
    const text = line.replace(reg,"").trim();
    if(text) result.push({time,text});
  })
  return result.sort((a,b)=>a.time-b.time);
}

// 渲染歌词DOM
function renderLyric(list){
  lyricWrap.innerHTML = "";
  lyricList = list;
  if(list.length === 0){
    lyricWrap.innerHTML = `<div class="lyric-line">暂无歌词</div>`;
    return;
  }
  list.forEach(item=>{
    const div = document.createElement('div');
    div.className = "lyric-line";
    div.innerText = item.text;
    lyricWrap.appendChild(div);
  })
}

// 更新歌词高亮+滚动
function updateLyric(){
  const currentTime = player.currentTime;
  let activeIndex = 0;
  for(let i=0;i<lyricList.length;i++){
    if(currentTime >= lyricList[i].time){
      activeIndex = i;
    }else break;
  }
  const lines = document.querySelectorAll('.lyric-line');
  lines.forEach((line,idx)=>{
    line.classList.toggle('active', idx === activeIndex);
  })
  // 滚动居中
  lyricWrap.style.transform = `translateY(${ -activeIndex * 48 + 120 }px)`;
}

// 按钮点击事件
btns.forEach(btn=>{
  btn.onclick = function(){
    const audioSrc = this.dataset.src;
    const lrcRaw = this.dataset.lrc;
    // 如果点当前正在播放的歌，则暂停
    if(player.src.includes(audioSrc) && !player.paused){
      player.pause();
      btns.forEach(b=>b.classList.remove('playing'));
      return;
    }
    // 重置所有按钮
    btns.forEach(b=>b.classList.remove('playing'));
    this.classList.add('playing');
    player.src = audioSrc;
    renderLyric(parseLRC(lrcRaw));
    player.play();
  }
})

// 播放进度持续更新歌词
player.ontimeupdate = updateLyric;

// 播放结束
player.onended = ()=>{
  btns.forEach(b=>b.classList.remove('playing'));
  lyricWrap.innerHTML = "";
  lyricList = [];
}
</script>
