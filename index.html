        .alipay-box{background:#222;padding:28px 22px;border-radius:12px;max-width:420px}

        /* 歌词容器：可视取景框，固定高度，超出裁剪 */
        .lyric-box{min-height:320px;max-height:60vh;height:60vh;overflow:hidden;position:relative;margin-top:16px}
        .lyric-inner{transition:none;will-change:transform}
        /* 单行歌词强制固定40px，JS滚动行高和DOM完全对齐 */
        .lyric-line{padding:0 10px;text-align:center;font-size:18px;color:#aaa;height:40px;display:flex;align-items:center;justify-content:center}
        .lyric-line.active{color:#2185ff;font-weight:bold;font-size:20px}

        // ==========★ 专辑配置区结束 ★==========

        // =================全局变量================
        let currentSongIndex = -1;   // 当前播放歌曲下标
        let currentLrcList = [];     // 当前歌曲歌词数组
        let rafId = null;            // 帧循环ID

        // ==========【核心】全局只用一个audio元素，切歌只改src，不新建元素==========
        // 手机浏览器：手动点过的同一元素，允许继续自动播放下一首（解决"播完跳下一首但没声音"）
        const audio = document.createElement('audio');
        audio.id = 'mainAudio';
        audio.preload = 'auto';
        document.body.appendChild(audio);

        const btnWrap = document.getElementById('btnWrap');
        const lyricWrap = document.getElementById('lyricWrap');

        // ========== LRC歌词解析 ==========
        function parseLrc(lrcText){
            const lines = lrcText.split('\n');
            const result = [];
            const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            lines.forEach(line=>{
                const match = line.match(reg);
                if(match){
                    const min = Number(match[1]), sec = Number(match[2]), ms = Number(match[3]);
                    const time = min*60 + sec + ms/1000;
                    const text = line.replace(reg,'').trim();
                    if(text) result.push({time,text});
                }
            });
            return result.sort((a,b)=>a.time-b.time);
        }

        // ========== 渲染歌词DOM ==========
        function renderLyric(list){
            lyricWrap.innerHTML = '';
            list.forEach(item=>{
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.innerText = item.text;
                lyricWrap.appendChild(div);
            });
            lyricWrap.offsetHeight; // 强制回流，拿到真实高度
            updateLyric(0, list);
        }

        // ========== 更新歌词高亮与滚动（只限顶部，不限底部，避免中途卡死）==========
        function updateLyric(nowTime, list){
            if(!list || list.length === 0) return;
            let activeIndex = 0;
            for(let i=0;i<list.length;i++){
                if(nowTime >= list[i].time) activeIndex = i;
            }
            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach((line,idx)=>{
                line.classList.toggle('active', idx === activeIndex);
            });
            const lineHeight = 40;
            const boxHeight = lyricWrap.parentElement.clientHeight || 320;
            let translateY = -activeIndex * lineHeight + boxHeight/2;
            if(translateY > 0) translateY = 0; // 只限制开头，不锁底部
            lyricWrap.style.transform = `translateY(${translateY}px)`;
        }

        // ========== 帧循环更新歌词 ==========
        function lyricLoop(){
            if(!audio.paused && currentLrcList.length>0){
                updateLyric(audio.currentTime, currentLrcList);
            }
            rafId = requestAnimationFrame(lyricLoop);
        }
        function stopLyricLoop(){
            if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
        }

        // ========== Media Session：锁屏后继续播放 + 锁屏控制条 ==========
        // 注意：这里不申请屏幕唤醒锁，息屏后屏幕保持熄灭，但音频靠mediaSession继续播
        function updateMediaSession(title){
            if(!('mediaSession' in navigator)) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title, artist: '任素汐', album: '任素汐专辑'
            });
            navigator.mediaSession.setActionHandler('play', ()=>{ audio.play(); });
            navigator.mediaSession.setActionHandler('pause', ()=>{ audio.pause(); });
            navigator.mediaSession.setActionHandler('previoustrack', ()=>{ playSongByIndex((currentSongIndex-1+songList.length)%songList.length); });
            navigator.mediaSession.setActionHandler('nexttrack', ()=>{ playSongByIndex((currentSongIndex+1)%songList.length); });
        }

        // ==========【核心】按下标播放歌曲（按钮点击 + 自动切下一首 共用）==========
        function playSongByIndex(idx){
            if(idx<0 || idx>=songList.length) return;
            const targetSong = songList[idx];
            currentSongIndex = idx;

            // 更新按钮高亮
            document.querySelectorAll('.play-btn').forEach(b=>b.classList.remove('active'));
            const btn = document.querySelector(`.play-btn[data-index="${idx}"]`);
            if(btn) btn.classList.add('active');

            // 更新歌词
            currentLrcList = parseLrc(targetSong.lrcText);
            renderLyric(currentLrcList);

            // 【关键】复用同一个audio元素，只替换src，保留已获授权的播放状态
            audio.src = targetSong.audioSrc;
            audio.play().catch(err=>{
                console.warn('自动播放被拦截，请点击歌曲按钮继续', err);
            });

            updateMediaSession(targetSong.name);
            lyricLoop();
        }

        // ========== 歌曲结束事件：自动切下一首，实现专辑循环 ==========
        audio.onended = function(){
            stopLyricLoop();
            let next = currentSongIndex + 1;
            if(next >= songList.length) next = 0; // 最后一首回到第一首
            playSongByIndex(next);
        };

        // ========== 渲染歌曲按钮 ==========
        function renderButtons(){
            btnWrap.innerHTML = "";
            songList.forEach((song, index)=>{
                const btn = document.createElement('button');
                btn.className = 'play-btn';
                btn.innerText = song.name;
                btn.dataset.index = index;
                btn.onclick = function(){
                    if(!window.canPlayAudio) return;
                    const songIndex = Number(this.dataset.index);
                    // 点当前正在播放的歌 → 暂停
                    if(currentSongIndex === songIndex && !audio.paused){
                        audio.pause();
                        stopLyricLoop();
                        this.classList.remove('active');
                        return;
                    }
                    // 否则：播放这一首（用户手势内，一定不会被拦截）
                    playSongByIndex(songIndex);
                };
                btnWrap.appendChild(btn);
            });
        }

        // ========== 页面初始化 ==========
        renderButtons();
    </script>
</body>
